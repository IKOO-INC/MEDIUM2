{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-xl-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <div class="mb-4">
                        <h3 class="mb-1">
                            Remove Background
                        </h3>

                        <p class="text-muted mb-0">
                            Upload gambar dan hasilnya akan
                            langsung di-download setelah proses selesai.
                        </p>
                    </div>

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}

                    <form
                        action="{{ url_for('remove_bg') }}"
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Pilih Gambar
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                                required
                            >

                            <small class="text-muted">
                                Maksimal 20 MB.
                            </small>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Jenis Subjek
                            </label>

                            <select
                                name="foreground_type"
                                class="form-select"
                            >

                                <option value="">
                                    Otomatis
                                </option>

                                <option value="person">
                                    Orang
                                </option>

                                <option value="object">
                                    Objek
                                </option>

                                <option value="stamp">
                                    Stempel
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            <i class="ti-cut me-1"></i>
                            Remove Background
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
