{% extends "base.html" %}

{% block content %}

<div class="container-fluid remove-bg-page">

    <div class="remove-bg-card">

        <div class="remove-bg-card-header">

            <h3>
                Remove Background
            </h3>

            <p>
                Upload gambar dan hasilnya akan langsung
                didownload setelah proses selesai.
            </p>

        </div>


        <div class="remove-bg-card-body">

            {% if error %}

            <div class="remove-bg-alert">
                {{ error }}
            </div>

            {% endif %}


            <form
                action="{{ url_for('remove_bg') }}"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="remove-bg-form-group">

                    <label for="removeBgImage">
                        Pilih Gambar
                    </label>

                    <input
                        id="removeBgImage"
                        type="file"
                        name="image"
                        class="remove-bg-file-input"
                        accept="image/*"
                        required
                    >

                    <div class="remove-bg-info">
                        Format gambar yang didukung:
                        JPG, JPEG, PNG, WEBP.
                        Maksimal 20 MB.
                    </div>

                </div>


                <div class="remove-bg-form-group">

                    <label for="foregroundType">
                        Jenis Subjek
                    </label>

                    <select
                        id="foregroundType"
                        name="foreground_type"
                        class="remove-bg-select"
                    >

                        <option value="">
                            Otomatis
                        </option>

                        <option value="person">
                            Orang
                        </option>

                        <option value="object">
                            Objek
                        </option>

                        <option value="stamp">
                            Stempel
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="remove-bg-submit"
                >

                    Remove Background

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
