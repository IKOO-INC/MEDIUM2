{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row g-4">

        <!-- FORM -->
        <div class="col-lg-4">

            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <div class="mb-4">
                        <h3 class="mb-1">
                            Remove Background
                        </h3>

                        <p class="text-muted mb-0">
                            Hapus background gambar secara otomatis
                            menggunakan PicWish AI.
                        </p>
                    </div>

                    <form
                        id="removeBgForm"
                        enctype="multipart/form-data"
                    >

                        <!-- FILE -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Pilih Gambar
                            </label>

                            <input
                                type="file"
                                name="image"
                                id="imageInput"
                                class="form-control"
                                accept="image/*"
                                required
                            >

                            <small class="text-muted">
                                Maksimal 20 MB.
                            </small>

                        </div>


                        <!-- JENIS OBJEK -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Deteksi Subjek
                            </label>

                            <select
                                name="foreground_type"
                                class="form-select"
                            >

                                <option value="">
                                    Otomatis
                                </option>

                                <option value="person">
                                    Orang
                                </option>

                                <option value="object">
                                    Objek
                                </option>

                                <option value="stamp">
                                    Stempel
                                </option>

                            </select>

                        </div>


                        <!-- BUTTON -->
                        <button
                            type="submit"
                            id="processButton"
                            class="btn btn-primary w-100"
                        >

                            <span
                                id="processText"
                            >
                                Remove Background
                            </span>

                            <span
                                id="processSpinner"
                                class="spinner-border spinner-border-sm ms-2 d-none"
                            ></span>

                        </button>

                    </form>


                    <!-- ERROR -->
                    <div
                        id="errorBox"
                        class="alert alert-danger mt-3 d-none"
                    ></div>

                </div>
            </div>

        </div>


        <!-- PREVIEW -->
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <div>

                            <h4 class="mb-1">
                                Preview
                            </h4>

                            <small class="text-muted">
                                Geser slider untuk membandingkan
                                sebelum dan sesudah.
                            </small>

                        </div>

                        <a
                            href="#"
                            id="downloadButton"
                            class="btn btn-success d-none"
                        >
                            <i class="ti-download me-1"></i>
                            Download PNG
                        </a>

                    </div>


                    <!-- COMPARISON -->
                    <div
                        id="comparisonWrapper"
                        class="remove-bg-comparison d-none"
                    >

                        <!-- AFTER -->
                        <img
                            id="afterImage"
                            class="comparison-image comparison-after"
                            alt="After Remove Background"
                        >


                        <!-- BEFORE OVERLAY -->
                        <div
                            id="beforeLayer"
                            class="comparison-before-layer"
                        >

                            <img
                                id="beforeImage"
                                class="comparison-image"
                                alt="Before Remove Background"
                            >

                        </div>


                        <!-- HANDLE -->
                        <div
                            id="comparisonHandle"
                            class="comparison-handle"
                        >

                            <div
                                class="comparison-handle-line"
                            ></div>

                            <div
                                class="comparison-handle-circle"
                            >
                                ⇆
                            </div>

                        </div>


                        <!-- LABELS -->
                        <div
                            class="comparison-label comparison-label-before"
                        >
                            BEFORE
                        </div>

                        <div
                            class="comparison-label comparison-label-after"
                        >
                            AFTER
                        </div>

                    </div>


                    <!-- SLIDER -->
                    <div
                        id="sliderWrapper"
                        class="mt-3 d-none"
                    >

                        <input
                            type="range"
                            id="comparisonSlider"
                            class="form-range"
                            min="0"
                            max="100"
                            value="50"
                        >

                    </div>


                    <!-- EMPTY STATE -->
                    <div
                        id="emptyPreview"
                        class="text-center py-5 text-muted"
                    >

                        <i
                            class="ti-image"
                            style="font-size: 48px;"
                        ></i>

                        <p class="mt-3 mb-0">
                            Pilih gambar untuk melihat preview.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<style>

.remove-bg-comparison {
    position: relative;
    width: 100%;
    min-height: 420px;
    overflow: hidden;
    border-radius: 16px;

    background-color: #f4f4f4;

    background-image:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);

    background-size: 32px 32px;

    background-position:
        0 0,
        0 16px,
        16px -16px,
        -16px 0;
}


.comparison-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;
    user-select: none;
    pointer-events: none;
}


.comparison-after {
    z-index: 1;
}


.comparison-before-layer {
    position: absolute;
    inset: 0;

    width: 50%;

    overflow: hidden;

    z-index: 2;

    border-right: 2px solid white;
}


.comparison-before-layer
.comparison-image {
    width: 100vw;
    max-width: none;
}


.comparison-handle {
    position: absolute;

    top: 0;
    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    z-index: 5;

    pointer-events: none;
}


.comparison-handle-line {
    position: absolute;

    left: 50%;
    top: 0;
    bottom: 0;

    width: 3px;

    background: white;

    transform: translateX(-50%);

    box-shadow:
        0 0 8px rgba(0, 0, 0, 0.35);
}


.comparison-handle-circle {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;

    color: #333;

    font-size: 20px;
    font-weight: 700;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 4px 15px
        rgba(0, 0, 0, 0.25);
}


.comparison-label {
    position: absolute;

    top: 16px;

    z-index: 10;

    padding:
        7px
        12px;

    border-radius: 6px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.5px;

    color: white;

    background:
        rgba(0, 0, 0, 0.55);
}


.comparison-label-before {
    left: 16px;
}


.comparison-label-after {
    right: 16px;
}


@media (max-width: 768px) {

    .remove-bg-comparison {
        min-height: 320px;
    }

}

</style>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const form =
            document.getElementById(
                'removeBgForm'
            );

        const imageInput =
            document.getElementById(
                'imageInput'
            );

        const beforeImage =
            document.getElementById(
                'beforeImage'
            );

        const afterImage =
            document.getElementById(
                'afterImage'
            );

        const beforeLayer =
            document.getElementById(
                'beforeLayer'
            );

        const handle =
            document.getElementById(
                'comparisonHandle'
            );

        const slider =
            document.getElementById(
                'comparisonSlider'
            );

        const comparisonWrapper =
            document.getElementById(
                'comparisonWrapper'
            );

        const sliderWrapper =
            document.getElementById(
                'sliderWrapper'
            );

        const emptyPreview =
            document.getElementById(
                'emptyPreview'
            );

        const downloadButton =
            document.getElementById(
                'downloadButton'
            );

        const processButton =
            document.getElementById(
                'processButton'
            );

        const processText =
            document.getElementById(
                'processText'
            );

        const processSpinner =
            document.getElementById(
                'processSpinner'
            );

        const errorBox =
            document.getElementById(
                'errorBox'
            );


        let currentObjectUrl = null;


        // ==============================
        // PREVIEW BEFORE
        // ==============================

        imageInput.addEventListener(
            'change',
            function () {

                const file =
                    imageInput.files[0];

                if (!file) {
                    return;
                }


                if (currentObjectUrl) {

                    URL.revokeObjectURL(
                        currentObjectUrl
                    );

                }


                currentObjectUrl =
                    URL.createObjectURL(
                        file
                    );


                beforeImage.src =
                    currentObjectUrl;


                comparisonWrapper.classList
                    .add('d-none');

                sliderWrapper.classList
                    .add('d-none');

                emptyPreview.classList
                    .remove('d-none');

                downloadButton.classList
                    .add('d-none');

            }
        );


        // ==============================
        // SLIDER
        // ==============================

        slider.addEventListener(
            'input',
            function () {

                const value =
                    Number(slider.value);

                beforeLayer.style.width =
                    `${value}%`;

                handle.style.left =
                    `${value}%`;

            }
        );


        // ==============================
        // SUBMIT
        // ==============================

        form.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();


                const file =
                    imageInput.files[0];


                if (!file) {

                    errorBox.textContent =
                        'Pilih gambar terlebih dahulu.';

                    errorBox.classList
                        .remove('d-none');

                    return;

                }


                errorBox.classList
                    .add('d-none');


                processButton.disabled =
                    true;

                processText.textContent =
                    'Sedang memproses...';

                processSpinner.classList
                    .remove('d-none');


                const formData =
                    new FormData(form);


                try {

                    const response =
                        await fetch(
                            '{{ url_for("remove_bg") }}',
                            {
                                method: 'POST',

                                body: formData,

                                headers: {
                                    'Accept':
                                        'application/json'
                                }
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok ||
                        !data.ok) {

                        throw new Error(
                            data.error ||
                            'Remove background gagal.'
                        );

                    }


                    // AFTER
                    afterImage.src =
                        data.result_url
                        + '?t='
                        + Date.now();


                    // BEFORE
                    // tetap berasal dari object URL
                    // yang sudah dibuat browser.


                    // RESET SLIDER
                    slider.value = 50;

                    beforeLayer.style.width =
                        '50%';

                    handle.style.left =
                        '50%';


                    // TAMPILKAN PREVIEW
                    emptyPreview.classList
                        .add('d-none');

                    comparisonWrapper.classList
                        .remove('d-none');

                    sliderWrapper.classList
                        .remove('d-none');


                    // DOWNLOAD
                    downloadButton.href =
                        data.download_url;

                    downloadButton.classList
                        .remove('d-none');


                } catch (error) {

                    errorBox.textContent =
                        error.message ||
                        'Terjadi kesalahan.';

                    errorBox.classList
                        .remove('d-none');

                } finally {

                    processButton.disabled =
                        false;

                    processText.textContent =
                        'Remove Background';

                    processSpinner.classList
                        .add('d-none');

                }

            }
        );

    }
);

</script>

{% endblock %}
